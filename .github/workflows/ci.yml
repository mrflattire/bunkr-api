name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        id: lint
        run: uv run ruff check .

      - name: Run tests with coverage
        id: test
        run: uv run pytest

      - name: Generate coverage badge JSON
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          uv run coverage json -o coverage.json
          uv run python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          pct = round(data['totals']['percent_covered'])
          badge = {'schemaVersion': 1, 'label': 'coverage', 'message': f'{pct}%', 'color': 'teal'}
          with open('coverage-badge.json', 'w') as f:
              json.dump(badge, f)
          "
          rm -f coverage.json

      - name: Generate CI badge JSON
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.lint.outcome }}" = "success" ] && [ "${{ steps.test.outcome }}" = "success" ]; then
            MESSAGE="passing"; COLOR="green"
          else
            MESSAGE="failing"; COLOR="red"
          fi
          cat > ci-badge.json <<EOF
          {"schemaVersion":1,"label":"CI","message":"${MESSAGE}","color":"${COLOR}"}
          EOF
          echo "WROTE ci-badge.json: $(cat ci-badge.json)"

      - name: Verify changed files
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: tj-actions/verify-changed-files@v20
        id: verify-changed-files
        with:
          files: |
            coverage-badge.json
            ci-badge.json

      - name: Commit badge data
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.name "coverage-badge-bot"
          git config --local user.email "coverage-badge-bot@users.noreply.github.com"
          git add coverage-badge.json ci-badge.json
          git commit -m "chore: update coverage and CI badge data"
          git push