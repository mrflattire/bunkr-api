name: Publish to PyPI
on:
  push:
    tags:
      - "v*"
jobs:
  test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install
      - name: Sync dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
  build:
    needs: test-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Publish
        run: uv publish
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags like v0.3.0b1 / v0.3.0rc1 / v0.3.0a2 / v0.3.0.dev1 are pre-releases.
          flags=""
          if [[ "$TAG" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            flags="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of the workflow: keep the existing release and notes, refresh the files.
            gh release upload "$TAG" dist/* --clobber
          else
            # Remove --draft to publish immediately instead of reviewing first.
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              --draft $flags
          fi