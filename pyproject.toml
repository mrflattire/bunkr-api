[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bunkr-api"
version = "0.1.0-beta.1"
description = "Interactive Python API wrapper for Bunkr"

requires-python = ">=3.12"

dependencies = [
    "rich>=13.0.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "yt-dlp>=2024.3.10",
    "urllib3>=2.0.0"
]

[project.scripts]
bunkr-api = "bunkr_api.cli:main"
bunkr-scrape = "bunkr_api.core.scraper:main"
bunkr-stream = "bunkr_api.media.player:main"
bunkr-mint = "bunkr_api.core.tokens:main"
bunkr-download = "bunkr_api.media.downloader:main"
bunkr-inspect = "bunkr_api.inspector:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100  

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes (catches undefined variables, syntax issues)
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modernize Python syntax)
    "SIM",    # flake8-simplify (catches SIM118, SIM102, etc.)
    "S",      # flake8-bandit (security / S112)
    "PL",     # Pylint rules (PLW1510)
    "RUF100", # Warns about unused # noqa directives
]

ignore = [
    "BLE001", # Blind except
    "S110",   # try-except-pass
    "DTZ",    # Timezone naive datetimes
    "E722",   # Bare except
    "SIM102", # Collapsible if
    "UP031",  # Allow % string formatting
    # --- New noise filters ---
    "E501",   # Line too long (110 violations - Rich markup strings)
    "E701",   # Multiple statements on one line with colon (e.g. `if cond: return`)
    "E702",   # Multiple statements on one line with semicolon
    "PLR",    # Pylint refactor limits (too-many-branches, arguments, statements, magic values)
    "PLC0415",# Import outside top-level (useful for CLI lazy imports)
    "S603",   # subprocess without shell=True
    "S607",   # Start process with partial path (e.g., calling 'mpv' or 'vlc' directly)
    "S608"    # Hardcoded SQL expression (false positives on dynamic placeholder strings)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/bunkr_api/cli.py" = ["ALL"]
"tests/**/*.py" = ["S101"] # Assert used in pytest liberally

[tool.ruff.lint.isort]
combine-as-imports = true
